name: Site — mise à jour YouTube et publication

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Toutes les six heures en UTC (publication légèrement différée possible).
    - cron: '23 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-bricolage
  cancel-in-progress: false

jobs:
  actualiser-et-publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tester le générateur et le sitemap vidéo
        run: python -m unittest discover -s tests -v

      - name: Synchroniser YouTube et fabriquer le site
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}
        run: python scripts/build_site.py

      - name: Vérifier l'intégration Cloudflare Web Analytics
        env:
          CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          token = os.environ.get('CF_WEB_ANALYTICS_TOKEN', '').strip()
          pages = [p for p in Path('site').rglob('*.html') if p.name == 'index.html']
          injected = [p for p in pages if 'static.cloudflareinsights.com/beacon.min.js' in p.read_text(encoding='utf-8')]
          if not token:
              print('::notice title=Cloudflare Web Analytics::Variable CF_WEB_ANALYTICS_TOKEN absente ou vide ; suivi non activé.')
          elif not re.fullmatch(r'[0-9a-fA-F]{32}', token):
              print('::warning title=Cloudflare Web Analytics::Jeton fourni mais format invalide (attendu 32 caractères hexadécimaux).')
          elif len(injected) == len(pages) and pages:
              print(f'Cloudflare Web Analytics : suivi installé dans {len(injected)} pages HTML.')
          else:
              raise SystemExit(f'Le jeton est valide mais le script est présent dans {len(injected)} pages sur {len(pages)}.')
          PY

      - name: Archiver les nouvelles vidéos dans GitHub
        shell: bash
        run: |
          git config user.name "bot-site-bricolage"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalogue.json
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour automatique du catalogue YouTube"
            git push
          fi

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer les fichiers à publier
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Mettre le site en ligne
        id: deploiement
        uses: actions/deploy-pages@v4

      - name: Prévenir Bing et les moteurs compatibles IndexNow
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/indexnow.py

      - name: Enregistrer les notifications IndexNow réussies
        shell: bash
        run: |
          git add data/indexnow-state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Mémoriser les URL signalées à IndexNow"
            git push
          fi
