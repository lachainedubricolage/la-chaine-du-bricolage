name: Site — mise à jour YouTube et publication

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Toutes les six heures en UTC (publication légèrement différée possible).
    - cron: '23 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-bricolage
  cancel-in-progress: false

jobs:
  actualiser-et-publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Synchroniser YouTube et fabriquer le site
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/build_site.py

      - name: Archiver les nouvelles vidéos dans GitHub
        shell: bash
        run: |
          git config user.name "bot-site-bricolage"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalogue.json
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour automatique du catalogue YouTube"
            git push
          fi

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer les fichiers à publier
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Mettre le site en ligne
        id: deploiement
        uses: actions/deploy-pages@v4
